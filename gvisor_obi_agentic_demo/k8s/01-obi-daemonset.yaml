apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: opentelemetry-ebpf-instrumentation
  namespace: opentelemetry
  labels:
    app.kubernetes.io/name: obi
    app.kubernetes.io/component: instrumentation-daemon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obi
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: obi-daemon
          image: gcr.io/gke-release/opentelemetry-ebpf-instrumentation:v0.12.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.opentelemetry.svc.cluster.local:4317"
            - name: GVISOR_RINGBUF_DIR
              value: "/run/gvisor-ringbuf"
            - name: GVISOR_ENABLE_KTLS
              value: "true"
            - name: GVISOR_ENABLE_GENAI_DECODERS
              value: "true"
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_PTRACE
                - SYS_ADMIN
                - BPF
                - NET_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: gvisor-ringbuf
              mountPath: /run/gvisor-ringbuf
              mountPropagation: HostToContainer
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
      volumes:
        - name: gvisor-ringbuf
          hostPath:
            path: /run/gvisor-ringbuf
            type: DirectoryOrCreate
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
