apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-orchestrator-code
  namespace: ai-agent
  labels:
    app: agent-orchestrator
data:
  app.py: |
    import os
    import sys
    import json
    import asyncio
    import httpx
    from fastapi import FastAPI, Request
    from fastapi.responses import JSONResponse

    app = FastAPI(title="Customer Service Agent Orchestrator")

    PROJECT_ID = os.environ.get("GCP_PROJECT", "dashpole-dev")
    LOCATION = os.environ.get("GCP_LOCATION", "us-central1")
    GEMINI_ENDPOINT = os.environ.get(
        "GEMINI_ENDPOINT",
        "http://gemini-service.ai-agent.svc.cluster.local:8080/v1beta/models/gemini-1.5-flash:generateContent"
    )

    @app.on_event("startup")
    async def seed_knowledge_base():
        """Ensure Qdrant collection is seeded with return policy knowledge."""
        for attempt in range(15):
            try:
                async with httpx.AsyncClient() as client:
                    res = await client.get("http://knowledge-vectordb.ai-agent.svc.cluster.local:6333/collections/kb", timeout=2.0)
                    if res.status_code == 404:
                        await client.put(
                            "http://knowledge-vectordb.ai-agent.svc.cluster.local:6333/collections/kb",
                            json={"vectors": {"size": 128, "distance": "Cosine"}},
                            timeout=3.0
                        )
                        await client.put(
                            "http://knowledge-vectordb.ai-agent.svc.cluster.local:6333/collections/kb/points?wait=true",
                            json={"points": [{"id": 1, "vector": [0.1]*128, "payload": {"policy": "Standard products are eligible for 30-day return window. Opened electronics are accepted with original box."}}]},
                            timeout=3.0
                        )
                        print("Seeded Qdrant KB collection successfully.", flush=True)
                    break
            except Exception:
                await asyncio.sleep(2)

    @app.get("/healthz")
    def health():
        return {"status": "ok"}

    @app.post("/chat")
    async def chat(request: Request):
        body = await request.json()
        user_prompt = body.get("prompt", "")

        # 1. Step 1: Model Context Protocol (MCP) Tool Discovery
        available_tools = []
        try:
            async with httpx.AsyncClient() as client:
                list_res = await client.post(
                    "http://order-mcp-server.ai-agent.svc.cluster.local:9000/mcp/tools/list",
                    json={"jsonrpc": "2.0", "id": 1, "method": "tools/list"},
                    timeout=3.0
                )
                if list_res.status_code == 200:
                    available_tools = list_res.json().get("result", {}).get("tools", [])
        except Exception as e:
            print(f"MCP tool discovery notice: {e}", file=sys.stderr, flush=True)

        # 2. Step 2: Semantic Retrieval from Qdrant Vector DB
        rag_policy = "Standard products are eligible for 30-day return window. Opened electronics are accepted with original box."
        try:
            async with httpx.AsyncClient() as client:
                v_res = await client.post(
                    "http://knowledge-vectordb.ai-agent.svc.cluster.local:6333/collections/kb/points/search",
                    json={"vector": [0.1]*128, "limit": 2, "with_payload": True},
                    timeout=4.0
                )
                if v_res.status_code == 200:
                    hits = v_res.json().get("result", [])
                    if hits:
                        rag_policy = hits[0].get("payload", {}).get("policy", rag_policy)
        except Exception as e:
            print(f"Vector search warning: {e}", file=sys.stderr, flush=True)

        # 3. Step 3: Model Context Protocol (MCP) Tool Execution
        order_data = {}
        try:
            async with httpx.AsyncClient() as client:
                mcp_payload = {
                    "jsonrpc": "2.0",
                    "id": 1042,
                    "method": "tools/call",
                    "params": {
                        "name": "get_order_status",
                        "arguments": {"order_id": "1042"}
                    }
                }
                mcp_res = await client.post(
                    "http://order-mcp-server.ai-agent.svc.cluster.local:9000/mcp/tools/call/get_order_status",
                    json=mcp_payload,
                    timeout=5.0
                )
                if mcp_res.status_code == 200:
                    order_data = mcp_res.json().get("result", {})
                else:
                    order_data = {"error": f"MCP error HTTP {mcp_res.status_code}"}
        except Exception as e:
            print(f"MCP tool call warning: {e}", file=sys.stderr, flush=True)
            order_data = {"error": str(e)}

        # 4. Step 4: LLM Model Call (Gemini Inference)
        generated_text = ""
        model_name_used = "gemini-1.5-flash"
        try:
            gemini_payload = {
                "contents": [
                    {
                        "role": "user",
                        "parts": [
                            {
                                "text": (
                                    f"Customer Query: {user_prompt}\n"
                                    f"Retrieved Policy: {rag_policy}\n"
                                    f"Tool Execution Result: {json.dumps(order_data)}\n"
                                    "Generate customer response."
                                )
                            }
                        ]
                    }
                ],
                "generationConfig": {"temperature": 0.2, "maxOutputTokens": 256}
            }
            async with httpx.AsyncClient() as client:
                g_res = await client.post(GEMINI_ENDPOINT, json=gemini_payload, timeout=5.0)
                if g_res.status_code == 200:
                    g_json = g_res.json()
                    candidates = g_json.get("candidates", [])
                    if candidates:
                        generated_text = candidates[0].get("content", {}).get("parts", [{}])[0].get("text", "")
                    model_name_used = g_json.get("modelVersion", "gemini-1.5-flash")
        except Exception as e:
            print(f"Gemini call error: {e}", file=sys.stderr, flush=True)

        if not generated_text:
            if "error" in order_data and not order_data.get("order_id"):
                generated_text = f"Warning: Unable to retrieve order details ({order_data.get('error')}). Policy: {rag_policy}"
            else:
                generated_text = f"Order #{order_data.get('order_id', '1042')} is {order_data.get('status', 'DELIVERED')} ({order_data.get('item', 'Google Pixel 9 Pro 256GB Obsidian')}). Delivered on {order_data.get('delivered_date', '2026-08-10')}. According to our policy: {rag_policy}"

        return JSONResponse({
            "response": generated_text,
            "llm_model": model_name_used,
            "mcp_discovered_tools": [t.get("name") for t in available_tools],
            "mcp_tool_result": order_data,
            "rag_policy_retrieved": rag_policy,
            "status": "success" if "error" not in order_data else "degraded"
        })
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: ai-agent
  labels:
    app: agent-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
    spec:
      serviceAccountName: ai-agent-sa
      containers:
      - name: agent
        image: python:3.11-slim
        command: ["sh", "-c"]
        args:
        - |
          pip install --no-cache-dir fastapi uvicorn httpx
          exec uvicorn --app-dir=/app app:app --host=0.0.0.0 --port=8000
        ports:
        - containerPort: 8000
          name: agent-http
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      volumes:
      - name: code
        configMap:
          name: agent-orchestrator-code
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  namespace: ai-agent
  labels:
    app: agent-orchestrator
spec:
  type: ClusterIP
  selector:
    app: agent-orchestrator
  ports:
  - port: 8000
    targetPort: 8000
    name: agent-http
