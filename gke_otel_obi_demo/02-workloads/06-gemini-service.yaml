apiVersion: v1
kind: ConfigMap
metadata:
  name: gemini-service-code
  namespace: ai-agent
  labels:
    app: gemini-service
data:
  server.py: |
    import json
    import os
    import sys
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler

    class GeminiHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"status":"ok","model":"gemini-1.5-flash"}')
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            length = int(self.headers.get('content-length', 0))
            req_data = self.rfile.read(length).decode('utf-8') if length > 0 else "{}"
            try:
                req = json.loads(req_data)
            except Exception:
                self.send_error(400, "Invalid JSON")
                return

            # Emulate slight LLM token generation latency (35ms)
            time.sleep(0.035)

            # Check if request is OpenAI chat format or Gemini generateContent format
            is_openai_format = "/chat/completions" in self.path or "messages" in req

            if is_openai_format:
                resp = {
                    "id": "chatcmpl-obi-demo-1042",
                    "object": "chat.completion",
                    "created": int(time.time()),
                    "model": req.get("model", "gemini-1.5-flash-002"),
                    "system_fingerprint": "fp_gemini_obi",
                    "choices": [
                        {
                            "index": 0,
                            "message": {
                                "role": "assistant",
                                "content": "Order #1042 is DELIVERED (Google Pixel 9 Pro 256GB Obsidian, delivered 2026-08-10 via FedEx). Based on our return policy: Standard products are eligible for a 30-day return window. Opened electronics are accepted with the original box."
                            },
                            "finish_reason": "stop"
                        }
                    ],
                    "usage": {
                        "prompt_tokens": 112,
                        "completion_tokens": 48,
                        "total_tokens": 160
                    }
                }
            else:
                # Generate structured response conforming to Google GenAI / Gemini API
                resp = {
                    "candidates": [
                        {
                            "content": {
                                "parts": [
                                    {
                                        "text": "Order #1042 is DELIVERED (Google Pixel 9 Pro 256GB Obsidian, delivered 2026-08-10 via FedEx). Based on our return policy: Standard products are eligible for a 30-day return window. Opened electronics are accepted with the original box."
                                    }
                                ],
                                "role": "model"
                            },
                            "finishReason": "STOP",
                            "index": 0
                        }
                    ],
                    "usageMetadata": {
                        "promptTokenCount": 112,
                        "candidatesTokenCount": 48,
                        "totalTokenCount": 160
                    },
                    "modelVersion": "gemini-1.5-flash-002"
                }

            body = json.dumps(resp).encode('utf-8')
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    if __name__ == "__main__":
        print("Starting Gemini / GenAI Model Service on port 8080...", flush=True)
        server = HTTPServer(('0.0.0.0', 8080), GeminiHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-service
  namespace: ai-agent
  labels:
    app: gemini-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemini-service
  template:
    metadata:
      labels:
        app: gemini-service
    spec:
      containers:
      - name: gemini
        image: python:3.11-slim
        command: ["python3", "-u", "/app/server.py"]
        ports:
        - containerPort: 8080
          name: gemini-http
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: code
        configMap:
          name: gemini-service-code
---
apiVersion: v1
kind: Service
metadata:
  name: gemini-service
  namespace: ai-agent
  labels:
    app: gemini-service
spec:
  type: ClusterIP
  selector:
    app: gemini-service
  ports:
  - port: 8080
    targetPort: 8080
    name: gemini-http
