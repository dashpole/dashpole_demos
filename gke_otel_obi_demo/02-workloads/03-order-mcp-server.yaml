apiVersion: v1
kind: ConfigMap
metadata:
  name: order-mcp-server-code
  namespace: ai-agent
  labels:
    app: order-mcp-server
data:
  server.py: |
    import json
    import os
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler

    class MCPHandler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            print(f"[ORDER-MCP-SERVER] {self.address_string()} - {format % args}", flush=True)

        def handle_tools_list(self, req_id):
            resp = {
                "jsonrpc": "2.0",
                "id": req_id,
                "result": {
                    "tools": [
                        {
                            "name": "get_order_status",
                            "description": "Look up real-time status and shipping details for a customer order.",
                            "inputSchema": {
                                "type": "object",
                                "properties": {
                                    "order_id": {"type": "string", "description": "Order reference ID (e.g. 1042)"}
                                },
                                "required": ["order_id"]
                            }
                        },
                        {
                            "name": "process_refund",
                            "description": "Initiate an automated refund for an eligible returned order.",
                            "inputSchema": {
                                "type": "object",
                                "properties": {
                                    "order_id": {"type": "string"},
                                    "amount": {"type": "number"}
                                },
                                "required": ["order_id", "amount"]
                            }
                        }
                    ]
                }
            }
            body = json.dumps(resp).encode('utf-8')
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Mcp-Session-Id', 'mcp-session-1042')
            self.send_header('mcp-protocol-version', '2024-11-05')
            self.send_header('Content-Length', str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            latency = float(os.environ.get('INJECT_LATENCY', 0))

            if os.environ.get('INJECT_ERROR', 'false').lower() == 'true':
                print("[FAULT INJECTION] Emulating 500 Internal Server Error...", flush=True)
                self.send_error(500, "Injected Database Lock Timeout in Order MCP Server")
                return

            if self.path in ["/mcp/tools/list", "/tools/list"]:
                self.handle_tools_list(1)
                return

            length = int(self.headers.get('content-length', 0))
            req_data = self.rfile.read(length).decode('utf-8') if length > 0 else "{}"
            try:
                req = json.loads(req_data)
            except Exception:
                self.send_error(400, "Invalid JSON")
                return

            method = req.get('method')
            req_id = req.get('id', 1)

            # Extract tool name from URL path if present (e.g. /mcp/tools/call/get_order_status)
            path_parts = self.path.strip('/').split('/')
            tool_name_from_path = path_parts[-1] if len(path_parts) >= 3 and path_parts[1] == 'tools' and path_parts[2] == 'call' else None

            if method == 'tools/list' or self.path.endswith('tools/list'):
                self.handle_tools_list(req_id)
                return
            elif method == 'tools/call' or 'tools/call' in self.path:
                if latency > 0:
                    print(f"[FAULT INJECTION] Adding artificial latency of {latency}s to tool execution...", flush=True)
                    time.sleep(latency)

                params = req.get('params', {})
                tool_name = params.get('name') or tool_name_from_path or 'get_order_status'
                arguments = params.get('arguments', {})

                if tool_name == 'get_order_status':
                    order_id = str(arguments.get("order_id", "1042"))
                    result_data = {
                        "order_id": order_id,
                        "status": "DELIVERED",
                        "item": "Google Pixel 9 Pro 256GB Obsidian",
                        "delivered_date": "2026-08-10",
                        "carrier": "FedEx",
                        "tracking_number": "FX-992817264",
                        "return_eligible": True
                    }
                    resp = {
                        "jsonrpc": "2.0",
                        "id": req_id,
                        "result": {
                            "content": [
                                {
                                    "type": "text",
                                    "text": json.dumps(result_data)
                                }
                            ],
                            "isError": False,
                            **result_data
                        }
                    }
                elif tool_name == 'process_refund':
                    order_id = str(arguments.get("order_id", "1042"))
                    amount = arguments.get("amount", 999.00)
                    result_data = {
                        "order_id": order_id,
                        "refund_status": "APPROVED",
                        "refund_id": "REF-8831920",
                        "amount": amount,
                        "currency": "USD"
                    }
                    resp = {
                        "jsonrpc": "2.0",
                        "id": req_id,
                        "result": {
                            "content": [
                                {
                                    "type": "text",
                                    "text": json.dumps(result_data)
                                }
                            ],
                            "isError": False,
                            **result_data
                        }
                    }
                else:
                    resp = {
                        "jsonrpc": "2.0",
                        "id": req_id,
                        "error": {"code": -32601, "message": f"Method '{tool_name}' not found"}
                    }
            else:
                resp = {
                    "jsonrpc": "2.0",
                    "id": req_id,
                    "error": {"code": -32600, "message": f"Unsupported method: {method}"}
                }

            body = json.dumps(resp).encode('utf-8')
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Mcp-Session-Id', 'mcp-session-1042')
            self.send_header('mcp-protocol-version', '2024-11-05')
            self.send_header('Content-Length', str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    if __name__ == "__main__":
        print("Starting Order MCP Server on port 9000...", flush=True)
        server = HTTPServer(('0.0.0.0', 9000), MCPHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-mcp-server
  namespace: ai-agent
  labels:
    app: order-mcp-server
    registry.gke.io/functional-type: "MCP_SERVER"
    apphub.cloud.google.com/functional-type: "MCP_SERVER"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-mcp-server
  template:
    metadata:
      labels:
        app: order-mcp-server
        registry.gke.io/functional-type: "MCP_SERVER"
        apphub.cloud.google.com/functional-type: "MCP_SERVER"
    spec:
      containers:
        - name: mcp-server
          image: python:3.11-slim
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 9000
              name: mcp-http
          env:
            - name: INJECT_LATENCY
              value: "0"
            - name: INJECT_ERROR
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: order-mcp-server-code
---
apiVersion: v1
kind: Service
metadata:
  name: order-mcp-server
  namespace: ai-agent
  labels:
    app: order-mcp-server
spec:
  type: ClusterIP
  selector:
    app: order-mcp-server
  ports:
    - name: mcp-http
      port: 9000
      targetPort: 9000
