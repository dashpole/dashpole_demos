apiVersion: v1
kind: ConfigMap
metadata:
  name: order-mcp-code
  namespace: ai-agent
  labels:
    app: order-mcp-server
data:
  server.py: |
    import json
    import os
    import sys
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler

    class MCPHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"status":"ok"}')
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            # Check for simulated failure injection
            latency = float(os.environ.get('INJECT_LATENCY', 0))
            if latency > 0:
                print(f"[FAULT INJECTION] Adding artificial latency of {latency}s...", flush=True)
                time.sleep(latency)

            if os.environ.get('INJECT_ERROR', 'false').lower() == 'true':
                print("[FAULT INJECTION] Emulating 500 Internal Server Error...", flush=True)
                self.send_error(500, "Injected Database Lock Timeout in Order MCP Server")
                return

            length = int(self.headers.get('content-length', 0))
            req_data = self.rfile.read(length).decode('utf-8')
            try:
                req = json.loads(req_data)
            except Exception:
                self.send_error(400, "Invalid JSON")
                return

            method = req.get('method')
            req_id = req.get('id', 1)

            if method == 'tools/list':
                resp = {
                    "jsonrpc": "2.0",
                    "id": req_id,
                    "result": {
                        "tools": [
                            {
                                "name": "get_order_status",
                                "description": "Look up real-time status and shipping details for a customer order.",
                                "inputSchema": {
                                    "type": "object",
                                    "properties": {
                                        "order_id": {"type": "string", "description": "Order reference ID (e.g. 1042)"}
                                    },
                                    "required": ["order_id"]
                                }
                            },
                            {
                                "name": "process_refund",
                                "description": "Initiate an automated refund for an eligible returned order.",
                                "inputSchema": {
                                    "type": "object",
                                    "properties": {
                                        "order_id": {"type": "string"},
                                        "amount": {"type": "number"}
                                    },
                                    "required": ["order_id", "amount"]
                                }
                            }
                        ]
                    }
                }
            elif method == 'tools/call':
                params = req.get('params', {})
                tool_name = params.get('name')
                arguments = params.get('arguments', {})

                if tool_name == 'get_order_status':
                    order_id = str(arguments.get("order_id", "1042"))
                    resp = {
                        "jsonrpc": "2.0",
                        "id": req_id,
                        "result": {
                            "order_id": order_id,
                            "status": "DELIVERED",
                            "item": "Google Pixel 9 Pro 256GB Obsidian",
                            "delivered_date": "2026-08-10",
                            "carrier": "FedEx",
                            "tracking_number": "FX-992817264",
                            "return_eligible": True
                        }
                    }
                elif tool_name == 'process_refund':
                    order_id = str(arguments.get("order_id", "1042"))
                    amount = arguments.get("amount", 999.00)
                    resp = {
                        "jsonrpc": "2.0",
                        "id": req_id,
                        "result": {
                            "order_id": order_id,
                            "refund_status": "APPROVED",
                            "refund_id": "REF-8831920",
                            "amount": amount,
                            "currency": "USD"
                        }
                    }
                else:
                    resp = {
                        "jsonrpc": "2.0",
                        "id": req_id,
                        "error": {"code": -32601, "message": f"Method '{tool_name}' not found"}
                    }
            else:
                resp = {
                    "jsonrpc": "2.0",
                    "id": req_id,
                    "error": {"code": -32600, "message": f"Unsupported method: {method}"}
                }

            body = json.dumps(resp).encode('utf-8')
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    if __name__ == "__main__":
        print("Starting Order MCP Server on port 9000...", flush=True)
        server = HTTPServer(('0.0.0.0', 9000), MCPHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-mcp-server
  namespace: ai-agent
  labels:
    app: order-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-mcp-server
  template:
    metadata:
      labels:
        app: order-mcp-server
    spec:
      containers:
      - name: mcp-server
        image: python:3.11-slim
        command: ["python3", "-u", "/app/server.py"]
        ports:
        - containerPort: 9000
          name: mcp-http
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: code
        configMap:
          name: order-mcp-code
---
apiVersion: v1
kind: Service
metadata:
  name: order-mcp-server
  namespace: ai-agent
  labels:
    app: order-mcp-server
spec:
  type: ClusterIP
  selector:
    app: order-mcp-server
  ports:
  - port: 9000
    targetPort: 9000
    name: mcp-http
