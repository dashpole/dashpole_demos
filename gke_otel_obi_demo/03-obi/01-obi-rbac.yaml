apiVersion: v1
kind: Namespace
metadata:
  name: otel-system
  labels:
    app.kubernetes.io/part-of: gke-otel-obi-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi-service-account
  namespace: otel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi-cluster-role-binding
subjects:
- kind: ServiceAccount
  name: obi-service-account
  namespace: otel-system
roleRef:
  kind: ClusterRole
  name: obi-cluster-role
  apiGroup: rbac.authorization.k8s.io
