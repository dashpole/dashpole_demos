apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config
  namespace: otel-system
  labels:
    app: obi
data:
  ebpf-instrument-config.yaml: |
    log_level: debug
    discovery:
      instrument:
        - k8s_namespace: "ai-agent"
        - open_ports: "8000,8080,9000,6333"
    otel_traces_export:
      endpoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317"
      insecure: true
      protocol: grpc
      sampler:
        name: always_on
      batch_timeout: 100ms
      max_queue_size: 4096
    otel_metrics_export:
      endpoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4318"
      insecure: true
      protocol: http/protobuf
      interval: 5s
      features:
        - application
        - network
    ebpf:
      context_propagation: all
      track_request_headers: true
      traffic_control_backend: auto
      payload_extraction:
        http:
          jsonrpc:
            enabled: true
          genai:
            mcp:
              enabled: true
            retrieval:
              enabled: true
            embedding:
              enabled: true
            gemini:
              enabled: true
    routes:
      unmatched: heuristic
    attributes:
      kubernetes:
        enable: true
    prometheus_export:
      port: 9090
      path: /metrics
    internal_metrics:
      prometheus:
        port: 6060
        path: /metrics
