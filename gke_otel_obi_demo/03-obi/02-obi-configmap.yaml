apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config
  namespace: otel-system
  labels:
    app: obi
data:
  ebpf-instrument-config.yaml: |
    log_level: debug
    discovery:
      instrument:
        - k8s_namespace: "ai-agent"
        - open_ports: "8000,8080,9000,6333"
    otel_traces_export:
      endpoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317"
      insecure: true
      protocol: grpc
      sampler:
        name: always_on
      batch_timeout: 100ms
      max_queue_size: 4096
    otel_metrics_export:
      endpoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317"
      insecure: true
      protocol: grpc
      interval: 5s
      features:
        - application
        - network
        - application_service_graph
    ebpf:
      buffer_sizes:
        http: 262144
      context_propagation: all
      track_request_headers: true
      traffic_control_backend: auto
      payload_extraction:
        http:
          jsonrpc:
            enabled: true
          genai:
            openai:
              enabled: true
            gemini:
              enabled: true
            anthropic:
              enabled: true
            mcp:
              enabled: true
            retrieval:
              enabled: true
            embedding:
              enabled: true
    routes:
      patterns:
        - /api/query
        - /chat
      unmatched: heuristic
    attributes:
      kubernetes:
        enable: true
      select:
        traces:
          include:
            - "*"
            - "gen_ai.*"
            - "mcp.*"
            - "rpc.*"
            - "db.*"
            - "http.*"
            - "http.request.header.*"
            - "http.response.header.*"
        metrics:
          include:
            - "*"
            - "gen_ai.*"
            - "mcp.*"
            - "rpc.*"
            - "db.*"
            - "http.*"
    prometheus_export:
      port: 9090
      path: /metrics
      features:
        - application
        - application_service_graph
        - network
    internal_metrics:
      prometheus:
        port: 6060
        path: /metrics
